<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-label="The engagement: scope, audit, on-site, off-site, measure — then off-site and measure repeat monthly.">
<style>
  .t{font-family:Didot, 'Bodoni 72', 'Bodoni MT', 'Playfair Display', Georgia, 'Songti SC', serif;fill:#1A1408} .s{font-family:'Avenir Next', 'Helvetica Neue', 'PingFang SC', 'Noto Sans CJK SC', Arial, sans-serif;fill:#1A1408}
  .pop{animation:pop 9s ease infinite}
  @keyframes pop{0%{opacity:.25}6%,90%{opacity:1}100%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){.pop{animation:none}}
</style>
<rect width="1200" height="250" fill="#FBF5E7"/>
<path d="M140,120 L1060,120" stroke="#1A1408" stroke-width="1.2" fill="none"/>
<path d="M140,120 L1060,120" stroke="#F0531C" stroke-width="3" fill="none" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100">
  <animate attributeName="stroke-dashoffset" values="100;0;0;100" keyTimes="0;.45;.9;1" dur="9s" repeatCount="indefinite"/>
</path>
<path id="loop" d="M1060,86 C1060,20 830,20 830,86" stroke="#F0531C" stroke-width="1.4" stroke-dasharray="4 5" fill="none"/>
<text x="945.0" y="28" text-anchor="middle" class="s" style="font-size:11px;letter-spacing:3px;fill:#F0531C">EVERY MONTH</text>
<circle r="5" fill="#F0531C"><animateMotion dur="3s" repeatCount="indefinite" path="M1060,86 C1060,20 830,20 830,86"/></circle>

  <g class="pop" style="animation-delay:0.0s">
    <circle cx="140" cy="120" r="34" fill="#FBF5E7" stroke="#1A1408" stroke-width="1.6"/>
    <text x="140" y="130" text-anchor="middle" class="t" style="font-size:30px;fill:#1A1408">0</text>
    <text x="140" y="184" text-anchor="middle" class="s" style="font-size:15px;font-weight:600">Scope &amp; baseline</text>
    <text x="140" y="204" text-anchor="middle" class="s" style="font-size:12px;fill:#7A6B4C">target questions · month 0</text>
  </g>
  <g class="pop" style="animation-delay:0.9s">
    <circle cx="370" cy="120" r="34" fill="#FBF5E7" stroke="#1A1408" stroke-width="1.6"/>
    <text x="370" y="130" text-anchor="middle" class="t" style="font-size:30px;fill:#1A1408">1</text>
    <text x="370" y="184" text-anchor="middle" class="s" style="font-size:15px;font-weight:600">Audit</text>
    <text x="370" y="204" text-anchor="middle" class="s" style="font-size:12px;fill:#7A6B4C">scored, prioritized roadmap</text>
  </g>
  <g class="pop" style="animation-delay:1.8s">
    <circle cx="600" cy="120" r="34" fill="#FBF5E7" stroke="#1A1408" stroke-width="1.6"/>
    <text x="600" y="130" text-anchor="middle" class="t" style="font-size:30px;fill:#1A1408">2</text>
    <text x="600" y="184" text-anchor="middle" class="s" style="font-size:15px;font-weight:600">On-site</text>
    <text x="600" y="204" text-anchor="middle" class="s" style="font-size:12px;fill:#7A6B4C">eligibility: crawlers, schema, answers</text>
  </g>
  <g class="pop" style="animation-delay:2.7s">
    <circle cx="830" cy="120" r="34" fill="#F0531C" stroke="#1A1408" stroke-width="1.6"/>
    <text x="830" y="130" text-anchor="middle" class="t" style="font-size:30px;fill:#FBF5E7">3</text>
    <text x="830" y="184" text-anchor="middle" class="s" style="font-size:15px;font-weight:600">Off-site</text>
    <text x="830" y="204" text-anchor="middle" class="s" style="font-size:12px;fill:#7A6B4C">the lever: citations &amp; mentions</text>
  </g>
  <g class="pop" style="animation-delay:3.6s">
    <circle cx="1060" cy="120" r="34" fill="#FBF5E7" stroke="#1A1408" stroke-width="1.6"/>
    <text x="1060" y="130" text-anchor="middle" class="t" style="font-size:30px;fill:#1A1408">4</text>
    <text x="1060" y="184" text-anchor="middle" class="s" style="font-size:15px;font-weight:600">Measure &amp; report</text>
    <text x="1060" y="204" text-anchor="middle" class="s" style="font-size:12px;fill:#7A6B4C">same questions, every month</text>
  </g>
</svg>
